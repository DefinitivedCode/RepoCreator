name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version, for example 1.3.2
        required: true
        type: string
      tag:
        description: Existing owner-approved tag matching vVERSION; this workflow never creates tags
        required: true
        type: string
      create_draft:
        description: Create a private draft after all builds pass (never publish)
        type: boolean
        default: false
      publication_review_complete:
        description: Owner approved this preparation and reviewed source/history privacy, licensing and platform warnings
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the reviewed workflow on main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Require preparation approval for a draft
        env:
          CREATE_DRAFT: ${{ inputs.create_draft }}
          REVIEWED: ${{ inputs.publication_review_complete }}
        run: |
          if [ "$CREATE_DRAFT" = true ] && [ "$REVIEWED" != true ]; then
            echo 'Draft creation requires the explicit owner review acknowledgement.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag and immutable commit
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release.mjs version --version "$VERSION" --tag "$TAG"
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Verify expected version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: node scripts/release.mjs version --version "$VERSION" --tag "$TAG"

  build:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml
    with:
      build_ref: ${{ needs.validate.outputs.commit }}
      expected_version: ${{ needs.validate.outputs.version }}
      release_tag: ${{ inputs.tag }}
      sign_updates: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  assemble:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: Repo-Creator-${{ needs.validate.outputs.version }}-*
          path: artifacts/downloaded
      - name: Verify complete artifact inventory and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPO_CREATOR_UPDATER_PUBLIC_KEY: ${{ vars.REPO_CREATOR_UPDATER_PUBLIC_KEY }}
        run: node scripts/release.mjs collect --version "$VERSION" --source artifacts/downloaded --output artifacts/release --updater true
      - uses: actions/upload-artifact@v4
        with:
          name: Repo-Creator-${{ needs.validate.outputs.version }}-release-assets
          if-no-files-found: error
          path: artifacts/release/*
      - name: Report prepared assets
        run: |
          printf '## Verified release assets\n\nAll three platform builds passed. No release has been published.\n\n' >> "$GITHUB_STEP_SUMMARY"
          find artifacts/release -maxdepth 1 -type f -printf '%f\n' | sort >> "$GITHUB_STEP_SUMMARY"

  draft:
    if: inputs.create_draft
    needs: [validate, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Repo-Creator-${{ needs.validate.outputs.version }}-release-assets
          path: release-assets
      - name: Refuse an existing release and create a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fqx "$TAG" existing-tags.txt; then
            echo 'A draft or published release already exists for this tag; nothing was changed.' >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GH_REPO" --verify-tag --draft \
            --title "Repo Creator $VERSION" --notes-file release-assets/RELEASE_NOTES.md \
            release-assets/Repo-Creator-* release-assets/LICENSE.txt \
            release-assets/THIRD_PARTY_NOTICES.txt release-assets/SHA256SUMS.txt release-assets/updater.json
          printf 'A draft was prepared for owner review. Publication remains a separate manual action.\n' >> "$GITHUB_STEP_SUMMARY"
