[package]
name = "repo-creator"
version = "1.1.0"
description = "A small, considered utility for starting Git repositories."
authors = ["DefinitivedCode"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "repo_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
open = "5"
tempfile = "3"
time = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
