[package]
name = "repo-creator"
version = "1.5.2"
description = "A small, considered utility for starting Git repositories."
authors = ["DefinitivedCode"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "repo_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
open = "5"
tempfile = "3"
time = "0.3"
toml = "1"
serde_yaml_ng = "0.10"
tauri-plugin-updater = "2"
semver = "1"
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
